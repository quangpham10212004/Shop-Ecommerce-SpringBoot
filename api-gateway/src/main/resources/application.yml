spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service-route
              uri: lb://user-service
              predicates:
                - Path=/v1/users/**
            - id: product-service-route
              uri: lb://product-service
              predicates:
                - Path=/v1/products/**
            - id: order-service-route
              uri: lb://order-service
              predicates:
                - Path=/v1/orders/**
            - id: auth-service-route
              uri: lb://auth-service
              predicates:
                - Path=/v1/auth/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/spring-2026
          jwk-set-uri: http://localhost:8180/realms/spring-2026/protocol/openid-connect/certs
server:
  port: 8282

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8762/eureka
    enabled: true