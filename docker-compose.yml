version: '3.8'

services:

  # ─────────────────────────────────────────
  # DATABASE — MariaDB 10.11
  # Port: 3306
  # Tạo sẵn 4 schema khi khởi động
  # ─────────────────────────────────────────
  mariadb:
    image: mariadb:10.11
    container_name: shop-mariadb
    ports:
      - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ngocquang04
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - shop-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # KEYCLOAK 22.0.5
  # Port: 8180  (Admin: http://localhost:8180 — admin/password)
  # ─────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:22.0.5
    container_name: vti-keycloak
    environment:
      KC_DB: mariadb
      KC_DB_URL_HOST: mariadb
      KC_DB_URL_PORT: 3306
      KC_DB_URL_DATABASE: keycloak_db
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: ngocquang04
      KC_HOSTNAME: localhost
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: password
    command: start-dev
    ports:
      - "8180:8080"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - shop-network

  # ─────────────────────────────────────────
  # REDIS 7 — Cache + Redisson Distributed Lock
  # Port: 6379
  # ─────────────────────────────────────────
  redis:
    image: redis:7.0-alpine
    container_name: shop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - shop-network

  redis-insight:
    image: redislabs/redisinsight:1.14.0
    container_name: redis-insight-ui
    ports:
      - "8001:8001"
    volumes:
      - redis-insight-data:/data
    depends_on:
      - redis
    networks:
      - shop-network

  # ─────────────────────────────────────────
  # KAFKA + ZOOKEEPER
  # Kafka: 9092 (external) / 29092 (internal docker)
  # ─────────────────────────────────────────
  zookeeper:
    image: wurstmeister/zookeeper
    container_name: shop-zookeeper
    ports:
      - "2181:2181"
    networks:
      - shop-network

  kafka:
    image: wurstmeister/kafka
    container_name: shop-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:29092,OUTSIDE://localhost:9092
      KAFKA_LISTENERS: INSIDE://:29092,OUTSIDE://:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
    depends_on:
      - zookeeper
    volumes:
      - kafka-data:/kafka
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - shop-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: shop-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
    networks:
      - shop-network

  # ─────────────────────────────────────────
  # ELK STACK — Logging
  # Elasticsearch: 9200 | Kibana: 5601 | Logstash: 5044
  # ─────────────────────────────────────────
  elasticsearch:
    image: elasticsearch:7.17.10
    container_name: shop-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - shop-network

  logstash:
    image: logstash:7.17.10
    container_name: shop-logstash
    ports:
      - "5044:5044"
      - "5000:5000/tcp"
      - "5000:5000/udp"
    volumes:
      - ./logstash/config/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    depends_on:
      - elasticsearch
    networks:
      - shop-network

  kibana:
    image: kibana:7.17.10
    container_name: shop-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://shop-elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - shop-network

volumes:
  mariadb-data:
  redis-data:
  redis-insight-data:
  kafka-data:
  es-data:

networks:
  shop-network:
    driver: bridge
